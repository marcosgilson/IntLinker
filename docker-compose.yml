services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: intlinker-dev
    container_name: intlinker-app
    ports:
      - '8000:80'
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./public/build:/var/www/html/public/build
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      APP_KEY: base64:3f8N2mD3mA1Oaw3Qx2g1c8Sxk5H0N4WQ7mG8w2Q9lKs=
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  vite:
    image: node:20-bullseye
    container_name: intlinker-vite
    working_dir: /var/www/html
    ports:
      - '5174:5174'
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    restart: unless-stopped
    depends_on:
      - app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"

  db:
    image: mysql:8.0
    container_name: intlinker-db
    restart: unless-stopped
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
  node_modules:
